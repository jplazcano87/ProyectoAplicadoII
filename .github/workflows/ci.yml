name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Black format check
        run: uv run black --check src/ tests/

      - name: Mypy (non-blocking)
        run: uv run mypy src/ || true

      - name: Pytest
        run: uv run pytest

      # Runs last so lint/tests report first. Fails while the golden has
      # references that don't exist in the corpus (the forcing function to fix
      # them via scripts/report_gold_invalid.py -> results/gold_to_fix.md).
      - name: Validate golden dataset (schema + reference existence)
        run: uv run python scripts/validate_golden.py data/golden/golden_dataset.jsonl
