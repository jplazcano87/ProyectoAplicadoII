[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normarag"
version = "0.1.0"
description = "Asistente de consulta sobre normativa bancaria chilena (CMF RAN)"
requires-python = ">=3.11"
dependencies = [
    # HTTP / scraping
    "httpx>=0.27",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    # PDF parsing
    "pymupdf>=1.24",
    # Embeddings / LLM
    "openai>=1.30",
    "anthropic>=0.28",
    "cohere>=5.5",
    # Vector store
    "qdrant-client[fastembed]>=1.9",
    # Orchestration
    "langgraph>=0.1",
    # Evaluation. RAGAS + langchain are pinned to the 0.2/0.3 line: newer
    # langchain-community (1.x) dropped modules that RAGAS still imports.
    "ragas>=0.2,<0.3",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "matplotlib>=3.8",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # UI
    "streamlit>=1.35",
    # Config
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # Utilities
    "tenacity>=8.3",
    "tiktoken>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/normarag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
